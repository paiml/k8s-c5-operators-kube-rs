# Supply-chain policy for opctl. kube-rs pulls a large dependency tree, so duplicate
# versions are reported rather than denied; yanked crates and unknown sources are refused.
[advisories]
yanked = "deny"
# serde_yaml 0.9 (via unsafe-libyaml) is unmaintained but has no known vulnerability;
# opctl only parses local example manifests with it.
ignore = ["RUSTSEC-2024-0449"]

[bans]
multiple-versions = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0", "OpenSSL"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
